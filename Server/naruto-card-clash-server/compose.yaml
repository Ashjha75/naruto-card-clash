services:
  postgres:
    image: postgres:18-alpine
    container_name: naruto-postgres
    environment:
      POSTGRES_DB: naruto_card_clash
      POSTGRES_USER: naruto
      POSTGRES_PASSWORD: secret
    ports:
      - "5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U naruto -d naruto_card_clash"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  redis:
    image: redis:8-alpine
    container_name: naruto-redis
    ports:
      - "6379"
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

volumes:
  postgres-data:
  redis-data: